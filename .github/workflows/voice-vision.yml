name: Keith Vigil voice and vision
on:
  push:
    branches: [features-voice-vision]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests
        run: |
          set -o pipefail
          swift test --jobs 2 2>&1 | tee unit-tests.log
          python3 scripts/check_voice_vision_isolation.py
          cd server
          python3 -m unittest test_brain -v
      - name: Generate native projects
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build Keith Mac and iOS and compile Macy isolation
        run: |
          for scheme in VigilMac VigilMacyMac; do
            xcodebuild -project Vigil.xcodeproj -scheme "$scheme" -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "build/$scheme" -jobs 2 CODE_SIGNING_ALLOWED=NO build > "$scheme-build.log" 2>&1
          done
          for scheme in Vigil VigilMacy; do
            xcodebuild -project Vigil.xcodeproj -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "build/$scheme" -jobs 2 CODE_SIGNING_ALLOWED=NO build > "$scheme-build.log" 2>&1
          done
      - name: Native Mac launch and feature view captures
        run: |
          APP=build/VigilMac/Build/Products/Release/Vigil.app
          lipo "$APP/Contents/MacOS/Vigil" -verify_arch arm64
          python3 scripts/check_frameworks.py "$APP"
          codesign --force --deep --sign - "$APP"
          open -g -n "$APP" --args --vigil-feature-proof "$PWD/feature-previews" --vigil-skip-intro
          sleep 20
          pgrep -f "/$APP/Contents/MacOS/Vigil"
          python3 scripts/check_feature_previews.py feature-previews
      - name: Preserve finished Keith apps
        run: |
          mkdir -p delivery
          ditto -c -k --sequesterRsrc --keepParent build/VigilMac/Build/Products/Release/Vigil.app delivery/Vigil-Mac.zip
          ditto -c -k --sequesterRsrc --keepParent build/Vigil/Build/Products/Release-iphoneos/Vigil.app delivery/Vigil-iOS.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Keith-Vigil-voice-vision
          retention-days: 5
          path: |
            delivery/
            feature-previews/
            unit-tests.log
            *-build.log

name: Vigil Mac Keychain recovery
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15, macos-26-intel]
permissions:
  contents: read
jobs:
  mac:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vigil-build
          run-id: 41849797194
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preserved
      - name: Generate project using the approved icon
        run: |
          command -v xcodegen || brew install xcodegen
          cp preserved/Resources/AppIcon.icns Resources/AppIcon.icns
          cp 'preserved/Resources/Vigil icon.png' 'Resources/Vigil icon.png'
          cp preserved/Resources/Assets.xcassets/AppIcon.appiconset/* Resources/Assets.xcassets/AppIcon.appiconset/
          xcodegen generate
          python3 scripts/check_icon.py
      - name: Run tests
        run: swift test --jobs 2 2>&1 | tee unit-tests.log
      - name: Build the two Mac editions
        run: |
          set -euo pipefail
          for item in 'VigilMac:mac' 'VigilMacyMac:macy-mac'; do
            scheme="${item%%:*}"; folder="${item#*:}"
            xcodebuild -project Vigil.xcodeproj -scheme "$scheme" -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "build/$folder" -jobs 2 CODE_SIGNING_ALLOWED=NO build > "$folder-build.log" 2>&1
            app="build/$folder/Build/Products/Release/Vigil.app"
            lipo "$app/Contents/MacOS/Vigil" -verify_arch arm64
            python3 scripts/check_frameworks.py "$app"
            codesign --force --deep --sign - "$app"
            open -g -n "$app" --args --vigil-skip-intro
            sleep 18
            pgrep -f "/$app/Contents/MacOS/Vigil"
            # Local native Mac supplies the animation gate: this older VM has no Metal renderer.
            pkill -x Vigil || true
            mkdir -p delivery
            ditto -c -k --sequesterRsrc --keepParent "$app" "delivery/$folder.zip"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vigil-Mac-recovery
          retention-days: 3
          path: |
            delivery/
            proofs/
            unit-tests.log
            *-build.log

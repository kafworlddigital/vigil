name: Vigil intro core tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test portable application core and saved choices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vigil-core/Sources/VigilCore /tmp/vigil-core/Tests/VigilTests
          cp Shared/FocusSession.swift Core/VigilCore.swift Core/OpenRouter.swift Core/ModelHealthRouter.swift Core/CompanionPreferences.swift /tmp/vigil-core/Sources/VigilCore/
          cp Tests/VigilTests/*.swift /tmp/vigil-core/Tests/VigilTests/
          cat > /tmp/vigil-core/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name:"VigilCore",targets:[.target(name:"VigilCore"),.testTarget(name:"VigilTests",dependencies:["VigilCore"])])
          SWIFT
          cd /tmp/vigil-core
          swift test --jobs 2 2>&1 | tee "$GITHUB_WORKSPACE/core-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intro-core-tests
          path: core-tests.log
          retention-days: 3

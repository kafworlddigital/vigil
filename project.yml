name: Vigil
options:
  bundleIdPrefix: com.kafworlddigital.vigil
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: V892V3PC6T
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Vigil:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - path: Shared
        excludes: [Fonts, VoiceTurnBuffer.swift]
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafworlddigital.vigil.ios
        PRODUCT_NAME: Vigil
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Vigil
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Vigil pairs securely with your Mac on the same Wi-Fi.
        NSBonjourServices: [_vigil._tcp]
        NSCameraUsageDescription: Scan your Mac's private Vigil pairing code.
        NSMicrophoneUsageDescription: Hold to talk to start a focus session or park an idea.
        NSSpeechRecognitionUsageDescription: Vigil recognises your words on this device, without uploading audio.
        NSCalendarsFullAccessUsageDescription: Choose today's calendar events as focus tasks. Vigil never changes your calendar.
  VigilMac:
    type: application
    platform: macOS
    sources:
      - App
      - Core
      - path: Shared
        excludes: [Fonts, VoiceTurnBuffer.swift]
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafworlddigital.vigil.mac
        PRODUCT_NAME: Vigil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/VigilMac.entitlements
    info:
      path: Config/Mac-Info.plist
      properties:
        CFBundleDisplayName: Vigil
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: Hold to talk to start a focus session or park an idea.
        NSSpeechRecognitionUsageDescription: Vigil recognises speech on this Mac without uploading audio.
        NSCalendarsFullAccessUsageDescription: Choose today's events and receive a ten-minute meeting heads-up. Vigil never changes your calendar.
        NSLocalNetworkUsageDescription: Vigil pairs with your iPhone and iPad on the same Wi-Fi.
        NSBonjourServices: [_vigil._tcp]
schemes:
  Vigil:
    build:
      targets:
        Vigil: all
  VigilMac:
    build:
      targets:
        VigilMac: all

name: Vigil release checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Unit tests
        run: swift test --jobs 2 2>&1 | tee unit-tests.log
      - name: Release simulator build
        run: xcodebuild -project Vigil.xcodeproj -scheme Vigil -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator -jobs 2 CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1
      - name: iPhone and iPad Release launch proofs
        run: python3 scripts/prove_release.py build/simulator/Build/Products/Release-iphonesimulator/Vigil.app
      - name: Mac release build
        run: xcodebuild -project Vigil.xcodeproj -scheme VigilMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build/mac -jobs 2 CODE_SIGNING_ALLOWED=NO build > mac-build.log 2>&1
      - name: Device release build
        run: xcodebuild -project Vigil.xcodeproj -scheme Vigil -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device -jobs 2 CODE_SIGNING_ALLOWED=NO build > device-build.log 2>&1
      - name: Inspect embedded frameworks
        run: |
          python3 scripts/check_frameworks.py build/mac/Build/Products/Release/Vigil.app
          python3 scripts/check_frameworks.py build/device/Build/Products/Release-iphoneos/Vigil.app
      - name: Package installation files
        run: |
          mkdir -p delivery
          ditto -c -k --sequesterRsrc --keepParent build/mac/Build/Products/Release/Vigil.app delivery/Vigil-Mac.zip
          ditto -c -k --sequesterRsrc --keepParent build/device/Build/Products/Release-iphoneos/Vigil.app delivery/Vigil-iOS.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vigil-release-evidence
          retention-days: 3
          path: |
            delivery/
            proofs/
            *-build.log
            unit-tests.log
